<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Institucional</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Barra de navegación -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <h1 class="text-lg font-extrabold text-slate-900">📋 Agenda Institucional</h1>
        <div id="navSessionInfo" class="flex items-center gap-3">
            <button onclick="abrirModalLogin()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
                Iniciar Sesión
            </button>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <main id="appContainer" class="max-w-6xl mx-auto p-6">
        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm text-center">
            <h2 class="text-2xl font-extrabold text-slate-900">Bienvenido</h2>
            <p class="text-sm text-slate-500 mt-2">Inicia sesión para acceder al panel según tu rol.</p>
        </div>
    </main>

    <!-- Modal Login -->
    <div id="modalLogin" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl space-y-4">
            <h2 class="text-xl font-extrabold text-slate-900">Iniciar Sesión</h2>
            <div class="space-y-3">
                <input type="text" id="loginUser" placeholder="Usuario" class="w-full px-4 py-2.5 border rounded-xl text-sm">
                <input type="password" id="loginPassword" placeholder="Contraseña" class="w-full px-4 py-2.5 border rounded-xl text-sm">
                <input type="password" id="loginTokenGitHub" placeholder="Token GitHub (solo admin/editor)" class="w-full px-4 py-2.5 border rounded-xl text-sm">
            </div>
            <div class="flex gap-2">
                <button onclick="cerrarModalLogin()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-sm transition">Cancelar</button>
                <button onclick="procesarLogin()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden"></div>

    <script src="app.js"></script>
</body>
</html>
